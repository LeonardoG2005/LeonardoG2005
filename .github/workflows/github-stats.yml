
name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LeonardoG2005
          base: header, activity, community, repositories
          config_timezone: America/Bogota
          config_output: svg
          config_theme: github-dark
          output_action: none
          filename: profile/stats.svg

      - name: Generate Top Languages SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LeonardoG2005
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          config_timezone: America/Bogota
          config_output: svg
          config_theme: github-dark
          output_action: none
          filename: profile/languages.svg

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/languages.svg
          git commit -m "Update GitHub stats" || exit 0
          git push
