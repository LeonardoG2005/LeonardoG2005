
name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/github-stats.yml"
      - "scripts/stats-cards.mjs"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate GitHub Stats and Top Languages SVGs
        run: node scripts/stats-cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          OUT_DIR: profile

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/languages.svg
          git commit -m "Update GitHub stats" || exit 0
          git push
