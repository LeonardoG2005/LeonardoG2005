<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 60" preserveAspectRatio="none">
  <defs>
    <style>
      .wave { animation: drift 5s linear infinite; }
      @keyframes drift {
        from { transform: translateX(0px); }
        to   { transform: translateX(-600px); }
      }
    </style>
  </defs>
  <g class="wave">
    <path fill="#47006e" opacity="0.70" d="
      M 0 30
      Q 75 60  150 30
      Q 225 0   300 30
      Q 375 60  450 30
      Q 525 0   600 30
      Q 675 60  750 30
      Q 825 0   900 30
      Q 975 60 1050 30
      Q 1125 0 1200 30
      Q 1275 60 1350 30
      Q 1425 0  1500 30
      Q 1575 60 1650 30
      Q 1725 0  1800 30
      L 1800 60
      L 0 60
      Z
    "/>
  </g>
</svg>
