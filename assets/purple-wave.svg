<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 60" preserveAspectRatio="none">
  <defs>
    <style>
      .wave { animation: drift 8s linear infinite; }
      @keyframes drift {
        from { transform: translateX(0px); }
        to   { transform: translateX(-600px); }
      }
    </style>
  </defs>
  <g class="wave">
    <path fill="#47006e" opacity="0.70" d="
      M 0 30 Q 75 0 150 30 Q 225 60 300 30 Q 375 0 450 30 Q 525 60 600 30
      Q 675 0 750 30 Q 825 60 900 30 Q 975 0 1050 30 Q 1125 60 1200 30
      Q 1275 0 1350 30 Q 1425 60 1500 30 Q 1575 0 1650 30 Q 1725 60 1800 30
      L 1800 0 L 0 0 Z
    "/>
  </g>
</svg>
