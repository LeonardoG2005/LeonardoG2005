<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 60" preserveAspectRatio="none">
  <defs>
    <style>
      .wave { animation: drift 8s linear infinite; }
      @keyframes drift {
        from { transform: translateX(0); }
        to   { transform: translateX(-600px); }
      }
    </style>
  </defs>
  <g class="wave">
    <path fill="#47006e" opacity="0.70" d="
      M0 0 Q150 60 300 30 Q450 0 600 30 Q750 60 900 30 Q1050 0 1200 30
      Q1350 60 1500 30 Q1650 0 1800 30
      L1800 0 Z
    "/>
  </g>
</svg>
