<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 60" preserveAspectRatio="none">
  <defs>
    <style>
      .wave { animation: drift 8s linear infinite; }
      @keyframes drift {
        from { transform: translateX(0px); }
        to   { transform: translateX(-1200px); }
      }
    </style>
  </defs>
  <g class="wave">
    <path fill="#47006e" opacity="0.70" d="
      M 0 60
      C 200 60  300 0   600 0
      C 900 0   1000 60 1200 60
      C 1400 60 1500 0  1800 0
      C 2100 0  2200 60 2400 60
      L 2400 60
      L 0 60
      Z
    "/>
  </g>
</svg>
