<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 60" preserveAspectRatio="none">
  <defs>
    <style>
      .wave { animation: drift 5s linear infinite; }
      @keyframes drift {
        from { transform: translateX(0px); }
        to   { transform: translateX(-600px); }
      }
    </style>
  </defs>
  <g class="wave">
    <path fill="#47006e" opacity="0.70" d="
      M 0 30
      Q 150 60  300 30
      Q 450 0   600 30
      Q 750 60  900 30
      Q 1050 0  1200 30
      Q 1350 60 1500 30
      Q 1650 0  1800 30
      L 1800 60
      L 0 60
      Z
    "/>
  </g>
</svg>
