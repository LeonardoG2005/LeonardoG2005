<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 60" preserveAspectRatio="none">
  <defs>
    <style>
      .wave { animation: drift 8s linear infinite; }
      @keyframes drift {
        from { transform: translateX(0px); }
        to   { transform: translateX(-800px); }
      }
    </style>
  </defs>
  <g class="wave">
    <path fill="#47006e" opacity="0.70" d="
      M 0 45
      C 150 45  250 10  400 10
      C 550 10  650 45  800 45
      C 950 45  1050 10 1200 10
      C 1350 10 1450 45 1600 45
      L 1600 60
      L 0 60
      Z
    "/>
  </g>
</svg>
